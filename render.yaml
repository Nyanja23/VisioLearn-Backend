services:
  # Production Web Service
  - type: web
    name: visiolearn-backend-prod
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python bootstrap_admin.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    autoDeploy: true
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: visiolearn-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
    envVarFile: .env.production

  # PostgreSQL Database
  - type: pserv
    name: visiolearn-db
    ipAllowList: []
    plan: free
    postgresVersion: 15
    region: oregon

# NOTE: the Redis service and Celery worker were removed deliberately.
# Question generation and summarising run on the student's device (the
# offline-first engine); the server only stores content and extracts text
# from uploaded files at request time. Nothing here needs a queue.
